spring:
  application:
    name: salary-management

  datasource:
    hikari:
      # Every application connection runs as the restricted role, so the INSERT/SELECT-only grant
      # on salary_revision applies to the running system and not just to a role in the catalogue.
      # The login user is a member of salary_app; the migration grants that membership.
      connection-init-sql: SET ROLE salary_app

  flyway:
    enabled: true
    # Defence in depth against inherited session state: a migration connection says who it is
    # rather than trusting what it was handed. Harmless on a clean connection, and the difference
    # between a working deploy and "permission denied for table flyway_schema_history" on one
    # that arrived from a pooler with SET ROLE still in effect.
    init-sqls:
      - RESET ROLE

  jpa:
    hibernate:
      # Flyway owns the schema. Hibernate is never allowed to create or alter it - a schema
      # that drifts between what Hibernate infers and what the migrations say is a schema
      # nobody can reason about.
      ddl-auto: validate
    open-in-view: false

security:
  jwt:
    # No default. A fallback secret committed to a repository is a published secret, and this one
    # signs the tokens that authorise payroll changes. SecurityConfig refuses to start without it.
    secret: ${JWT_SECRET:}

server:
  # The platform assigns the port; 8080 is the local default.
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        # Health only. Every other endpoint is an information disclosure nobody asked for.
        include: health
  endpoint:
    health:
      probes:
        enabled: true
