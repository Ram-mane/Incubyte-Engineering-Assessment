<mat-toolbar color="primary">
  <span>{{ title() }}</span>
  @if (session.isSignedIn()) {
    <nav class="app-toolbar__nav" aria-label="Main">
      <a mat-button routerLink="/dashboard" routerLinkActive="app-toolbar__link--active"
         ariaCurrentWhenActive="page">Dashboard</a>
      <a mat-button routerLink="/employees" routerLinkActive="app-toolbar__link--active"
         ariaCurrentWhenActive="page">Directory</a>
    </nav>
  }
  <span class="app-toolbar__spacer"></span>
  @if (session.isSignedIn()) {
    <span class="app-toolbar__role">{{ session.role() }}</span>
    <button mat-button type="button" (click)="signOut()">Sign out</button>
  }
</mat-toolbar>

<main class="app-content">
  <router-outlet />
</main>
