name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# A second push to the same branch makes the first run's result irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build and quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # The enforcer rejects anything outside 21.x, so this is the version the build
      # is actually verified against rather than whatever the runner happens to ship.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # verify runs the lot: Spotless, Checkstyle (including the money and time bans),
      # compilation, unit tests, PMD, JaCoCo's threshold, and the Testcontainers
      # integration tests against a real PostgreSQL 16.
      - name: Build and verify
        run: ./mvnw -B --no-transfer-progress verify

      - name: Mutation coverage
        run: ./mvnw -B --no-transfer-progress -Pmutation test

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/site/jacoco/
            target/pit-reports/
          if-no-files-found: ignore
          retention-days: 7
